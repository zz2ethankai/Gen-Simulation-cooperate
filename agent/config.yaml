version: 2

backend:
#  ---Codex settings
  # type: codex_cli
  # model: null

  # --- openai_api settings (ignored when type=codex_cli) ---
  type: openai_api
  base_url: https://api.deepseek.com/v1   # DeepSeek
  # base_url: https://api.openai.com/v1     # OpenAI
  api_key: null                            # null = $OPENAI_API_KEY
  model: deepseek-v4-pro

  # --- codex_cli settings (ignored when type=openai_api) ---
  sandbox: read-only
  ephemeral: true

paths:
  inventory: output/agent_inventory.json
  run_root: output/agent_runs

scene_roots:
  - InternDataAssets/Bench_2.1_isaacsim/scene_4
  - InternDataAssets/Bench_2.1_isaacsim

scene_ingest:
  enabled: true
  output_root: output/agent_scene_ingest
  out_dir_rel: assets/basic
  target_class_task_object: RigidObject
  task_id_source: scene_name
  envmap_lib: environment/envmaps
  max_episode_length: 10000
  support_fixture: central_work_table

execution:
  conda_env: interndata
  gpu: 0
  layout_gpus: [0, 1, 2, 3]
  timeout_sec: 1800
  max_revisions: 2
  retain_experience: true
  docker:
    compose_file: docker/docker-compose.yml
    launcher_config: configs/de_plan_with_render_template.yaml

generation:
  enabled: true
  random_num: 1
  seed: 0

debug:
  topdown_check: true
  topdown_template: robot_target_overhead_v1
  topdown_template_params:
    height_m: 1.75
    look_fraction: 0.65
    look_height_m: 0.0
  topdown_eye: null
  topdown_target: null
  topdown_resolution: [1280, 960]
  topdown_focal_length_mm: 24.0
  workspace_probe:
    # Planning-only CuRobo A/B diagnostic. Exact Stage collider Prim paths only.
    # PickPlanProbe restores every obstacle after planning; PhysX is unchanged.
    disable_curobo_obstacle_paths: []
    # Stronger planning-only isolation: both PhysX and CuRobo are restored in finally.
    disable_physics_and_curobo_obstacle_paths: []
    # Registered fixture/object names resolved to exact runtime collision Prim paths.
    disable_collision_entities: []

workspace:
  common_pose_max_heading_error_deg: 45.0
  max_common_candidates: 8

planning:
  collision_world:
    mode: physics_schema
    strict: true
    exact_exclusions: []
  pick_place:
    terminal_step_m: 0.005
    max_terminal_distance_m: 0.10
    place_settle_steps: 10
    return_to_episode_initial: true
    return_steps: 60
    return_joint_tolerance_rad: 0.03
  relation_predicate:
    geometry_tolerance_m: 0.002
    support_gap_tolerance_m: 0.006
    minimum_support_contact_n: 0.0
    max_unexpected_contact_n: 5.0
  spawn_settle:
    max_object_linear_speed_m_s: 0.02
    max_object_angular_speed_rad_s: 0.05
    max_robot_joint_speed_rad_s: 0.05
    max_unexpected_contact_n: 5.0
  execution_safety:
    enabled: true
    max_waypoint_stride: 2
    max_replans_per_phase: 2
    hold_steps_before_replan: 5
    dynamic_sync_interval_steps: 5
    attached_object_slip_rotation_deg: 15.0

skill_defaults:
  pick:
    filter_y_dir: [forward, 90]
    filter_z_dir: [downward, 140]
    pre_grasp_offset: 0.10
    gripper_change_steps: 10
    post_grasp_offset_min: 0.10
    post_grasp_offset_max: 0.15
    test_mode: forward
  place:
    place_direction: vertical
    filter_y_dir: [forward, 90]
    filter_z_dir: [downward, 140]
    x_ratio_range: [0.5, 0.5]
    y_ratio_range: [0.5, 0.5]
    pre_place_z_offset: 0.10
    place_z_offset: 0.02
    position_constraint: object
    success_mode: xybbox
    test_mode: forward
  relation:
    on:
      x_ratio_range: [0.5, 0.5]
      y_ratio_range: [0.5, 0.5]
      position_constraint: object
    inside:
      x_ratio_range: [0.5, 0.5]
      y_ratio_range: [0.5, 0.5]
      position_constraint: object
    left_of:
      x_ratio_range: [-0.30, -0.15]
      y_ratio_range: [0.5, 0.5]
      position_constraint: object
      success_mode: left
    right_of:
      x_ratio_range: [1.15, 1.30]
      y_ratio_range: [0.5, 0.5]
      position_constraint: object
      success_mode: right
    next_to:
      x_ratio_range: [1.15, 1.30]
      y_ratio_range: [0.4, 0.6]
      position_constraint: object
      success_mode: right
    hang:
      place_direction: horizontal
      position_constraint: object
    insert:
      place_direction: horizontal
      position_constraint: object
