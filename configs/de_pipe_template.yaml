name: simbox_pipe_local_navigation
load_stage:
  scene_loader:                            # Scene loader (plan process)
    type: env_loader
    args:
      workflow_type: SimBoxDualWorkFlow
      cfg_path: workflows/simbox/assets/custom/scene_8/01_kitchen/assets/basic/kitchen_apple_orange_to_tray/simbox_task.yaml # Task config path
      simulator:
        physics_dt: 1/30                   # Physics update rate
        rendering_dt: 1/30                 # Render update rate
        stage_units_in_meters: 1.0         # Stage unit scale
        headless: True                     # Headless mode (no GUI); set false for visual debugging
        experience: /isaac-sim/apps/omni.isaac.sim.python.gym.headless.kit
        anti_aliasing: 0                   # Anti-aliasing level
        multi_gpu: false                   # Keep this plan worker pinned to its assigned GPU
        max_gpu_count: 1
        active_gpu: 0                      # Assigned host GPU is exposed as container-local GPU 0
        physics_gpu: 0
        renderer: RayTracedLighting        # Isaac Sim 4.1 options: RayTracedLighting, PathTracing
        planning_step_render: true         # Mobile-base physics uses the rendered world-step path from plan_with_render
        disable_viewport_updates: true     # Render products still update; skip the unused viewport in headless planning

        # Minimum-cost planning preset. Planning needs rendered world steps for
        # Mobile-base physics does not need photorealistic RGB.
        rt_new_denoiser: false
        rt_shadows_enabled: false
        rt_direct_lighting_enabled: false
        rt_reflections_enabled: false
        rt_translucency_enabled: false
        rt_fractional_cutout_opacity: false
        rt_indirect_diffuse_enabled: false
        rt_ambient_occlusion_enabled: false
        rt_caustics_enabled: false
        rt_subsurface_enabled: false
  layout_random_generator:                 # Scene randomization
    type: env_randomizer
    args:
      random_num: 6                        # Number of random samples per task
      strict_mode: true                    # true: output count must equal random_num
plan_stage:
  seq_planner:                             # Trajectory planner
    type: env_planner
dump_stage:
  dumper:                                  # Serialize plan results for render process
    type: env
dedump_stage:
  dedumper:                                # Deserialize plan results in render process
    type: de
  scene_loader:                            # Scene loader (render process)
    type: env_loader
    args:
      workflow_type: SimBoxDualWorkFlow
      cfg_path: workflows/simbox/assets/custom/scene_8/01_kitchen/assets/basic/kitchen_apple_orange_to_tray/simbox_task.yaml  # Must match load_stage cfg_path
      simulator:
        physics_dt: 1/30                   # Physics update rate
        rendering_dt: 1/30                 # Render update rate
        rendering_interval: 1              # Render every N physics steps
        headless: true                     # Headless mode
        experience: /isaac-sim/apps/omni.isaac.sim.python.gym.headless.kit
        multi_gpu: false                   # Keep this render worker pinned to its assigned GPU
        max_gpu_count: 1
        active_gpu: 0                      # Ray exposes the assigned host GPU as container-local GPU 0
        physics_gpu: 0
        renderer: RayTracedLighting        # Match de_plan_with_render_template.yaml output quality
        anti_aliasing: 4

        # Keep this preset in sync with de_plan_with_render_template.yaml.
        rt_new_denoiser: true
        rt_shadows_enabled: true
        rt_shadow_sample_count: 4
        rt_reflections_enabled: true
        rt_reflections_max_bounces: 2
        rt_translucency_enabled: true
        rt_translucency_max_refraction_bounces: 4
        rt_fractional_cutout_opacity: true
        rt_indirect_diffuse_enabled: true
        rt_indirect_diffuse_spp: 2
        rt_indirect_diffuse_max_bounces: 2
        rt_ambient_occlusion_enabled: true
        rt_ambient_occlusion_max_samples: 4
  layout_random_generator:
    type: env_randomizer
  seq_planner:                             # Reads serialized trajectories
    type: env_reader
render_stage:
  renderer:                                # Renderer
    type: env_renderer
store_stage:
  writer:                                  # Data writer
    type: env_writer
    args:
      batch_async: false                   # Sync writes (safer for pipe mode)
      output_dir: output/${name}/          # Output directory
stage_pipe:
  stage_num: [3, 3]                        # Number of pipeline stages [plan, render]
  stage_dev: ["gpu", "gpu"]                # Device type per stage
  worker_num: [1, 1]                       # Number of workers per stage [plan, render]
  worker_schedule: True                    # Enable dynamic worker scheduling
  safe_threshold: 100                      # Max pending items before throttling
  status_timeouts:                         # Worker timeout thresholds (seconds, -1 = infinite)
    idle: 360                              # Max idle time before restart
    ready: -1                              # Max time in ready state
    running: 1800                          # Max running time per plan or replay task
  monitor_check_interval: 120              # Health check interval (seconds)
