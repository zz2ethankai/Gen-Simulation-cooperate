name: simbox_plan
load_stage:
  scene_loader:                            # Scene loader
    type: env_loader
    args:
      workflow_type: SimBoxDualWorkFlow
      cfg_path: workflows/simbox/core/configs/tasks/example/sort_the_rubbish.yaml  # Task config path
      simulator:
        physics_dt: 1/30                   # Physics update rate
        rendering_dt: 1/30                 # Render update rate
        stage_units_in_meters: 1.0         # Stage unit scale
        headless: True                     # Headless mode (no GUI)
        anti_aliasing: 0                   # Anti-aliasing level

        # Optional higher-quality RayTracedLighting settings:
        # renderer: RayTracedLighting
        # rt_new_denoiser: true            # DLSS Ray Reconstruction / realtime denoiser
        # rt_shadows_enabled: true
        # rt_shadow_sample_count: 4
        # rt_reflections_enabled: true
        # rt_reflections_max_bounces: 2
        # rt_translucency_enabled: true
        # rt_translucency_max_refraction_bounces: 4
        # rt_fractional_cutout_opacity: true
        # rt_indirect_diffuse_enabled: true
        # rt_indirect_diffuse_spp: 2
        # rt_indirect_diffuse_max_bounces: 2
        # rt_ambient_occlusion_enabled: true
        # rt_ambient_occlusion_max_samples: 4

        # Optional higher-quality PathTracing settings:
        # renderer: PathTracing
        # denoiser: True
        # samples_per_pixel_per_frame: 16
        # max_bounces: 4
        # max_specular_transmission_bounces: 6
        # max_volume_bounces: 64
        # total_spp: 256
        # adaptive_sampling: True
        # adaptive_sampling_target_error: 0.001
        # optix_temporal_denoiser: False
        # denoise_aovs: True
        # firefly_filter: True
  layout_random_generator:                 # Scene randomization
    type: env_randomizer
    args:
      random_num: 6                        # Number of random samples per task
      strict_mode: true                    # true: output count must equal random_num
plan_stage:
  seq_planner:                             # Trajectory planner (plan only, no rendering)
    type: env_planner
store_stage:
  writer:                                  # Data writer
    type: env_writer
    args:
      batch_async: true                    # Async writes (better perf, more memory)
      seq_output_dir: output/${name}/      # Trajectory output directory
