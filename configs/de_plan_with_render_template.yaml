name: simbox_plan_with_render
load_stage:
  scene_loader:                            # Scene loader
    type: env_loader
    args:
      workflow_type: SimBoxDualWorkFlow
      cfg_path: workflows/simbox/core/configs/tasks/basic/lift2/pour_redwine/left/pour_redwine_left.yaml
      simulator:
        physics_dt: 1/30                   # Physics update rate
        rendering_dt: 1/30                 # Render update rate
        stage_units_in_meters: 1.0         # Stage unit scale
        headless: True                    # Headless mode (no GUI); set false for visual debugging
        experience: /isaac-sim/apps/omni.isaac.sim.python.gym.headless.kit
        anti_aliasing: 4                   # Anti-aliasing level
        multi_gpu: False
        max_gpu_count: 1
        active_gpu: 0                      # Container-local GPU index; host GPU is selected by docker compose.
        physics_gpu: 0                     # Container-local GPU index; host GPU is selected by docker compose.
        renderer: RayTracedLighting        # Isaac Sim 4.1 options: RayTracedLighting, PathTracing

        # Higher-quality RayTracedLighting settings:
        rt_new_denoiser: true              # DLSS Ray Reconstruction / realtime denoiser
        rt_shadows_enabled: true
        rt_shadow_sample_count: 4
        rt_reflections_enabled: true
        rt_reflections_max_bounces: 2
        rt_translucency_enabled: true
        rt_translucency_max_refraction_bounces: 4
        rt_fractional_cutout_opacity: true
        rt_indirect_diffuse_enabled: true
        rt_indirect_diffuse_spp: 2
        rt_indirect_diffuse_max_bounces: 2
        rt_ambient_occlusion_enabled: true
        rt_ambient_occlusion_max_samples: 4

        # Optional higher-quality PathTracing settings:
        # renderer: PathTracing
        # denoiser: True
        # samples_per_pixel_per_frame: 16
        # max_bounces: 4
        # max_specular_transmission_bounces: 6
        # max_volume_bounces: 64
        # total_spp: 256
        # adaptive_sampling: True
        # adaptive_sampling_target_error: 0.001
        # optix_temporal_denoiser: False
        # denoise_aovs: True
        # firefly_filter: True
  layout_random_generator:                 # Scene randomization
    type: env_randomizer
    args:
      random_num: 4                       # Number of random samples per task
      strict_mode: false                   # true: output count must equal random_num
plan_with_render_stage:
  plan_with_render:                        # Plan and render in a single stage
    type: plan_with_render
    args:
      emit_obs_on_failure: true           # Whether to emit observations on planning failure (for debugging); set true to collect failure cases
      failure_obs_length: 1
store_stage:
  writer:                                  # Data writer
    type: env_writer
    args:
      batch_async: true                    # Async writes (better perf, more memory)
      output_dir: output/${name}/          # Output directory
