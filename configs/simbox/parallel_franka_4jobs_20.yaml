launcher_type: simbox_parallel_v2
name: franka_4jobs_20

parallel:
  backend: docker
  gpus: [0, 1, 2, 3]
  workers_per_gpu: 1
  run_id: null
  compose_file: docker/docker-compose.simbox.yml
  task_timeout_sec: 0
  stats_after_run: true
  dry_run: false
  task_preflight: true

startup_guard:
  enabled: false
  marker: "Simulation App Startup Complete"
  timeout_min: 5
  retry: 1

monitor:
  enabled: true
  mode: rich
  refresh_sec: 2
  silent_warn_sec: 600
  keep_finished_rows: 20
  theme: nvtop_like
  compact_paths: true
  show_gpu_panel: true
  show_data_panel: true

failure_guard:
  enabled: true
  kill_on_fatal_log: true
  kill_on_suspect_hang: true
  suspect_hang_kill_sec: 1800

progress:
  enabled: true
  mode: event_hook_first
  event_poll_interval_sec: 2
  dataset_scan_interval_sec: 30
  action_fps: 30
  video_fps: 15
  final_ffprobe_verify: true

failed_episode_cleanup:
  enabled: true
  mode: conservative
  require_finalized_event: true
  require_run_time_window: true
  delete_dirs: true
  keep_summary: true

cache_cleanup:
  enabled: true
  scope: current_run
  root: .docker/isaac-sim
  cleanup_on_success: true
  cleanup_on_failure: true
  cleanup_on_interrupt: true
  keep_summary: true

gpu_sampling:
  enabled: true
  interval_sec: 10
  output: gpu_samples.csv

defaults:
  de_config: configs/simbox/de_plan_with_render_template.yaml
  random_num: 1000
  dataset_root: null
  scene_info: null
  seed_base: 100
  shard_random_num: false

jobs:
  - id: close_microwave_part0_gpu0
    task: workflows/simbox/core/configs/tasks/art/franka/close_the_microwave/close_the_microwave_part0.yaml
    gpu: 0

  - id: open_microwave_part1_gpu1
    task: workflows/simbox/core/configs/tasks/art/franka/open_the_microwave/open_the_microwave_part1.yaml
    gpu: 1

  - id: pick_and_place_ball_gpu2
    task: workflows/simbox/core/configs/tasks/pick_and_place/franka/single_pick/omniobject3d-ball.yaml
    gpu: 2

  - id: pick_and_place_sweet_potato_gpu3
    task: workflows/simbox/core/configs/tasks/pick_and_place/franka/single_pick/omniobject3d-sweet_potato.yaml
    gpu: 3
