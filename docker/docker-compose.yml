name: ${INTERNDATA_COMPOSE_PROJECT:-simbox-isaac}

services:
  isaac:
    build:
      context: ..
      dockerfile: docker/isaac/Dockerfile
    image: local/isaac-sim-6.0.1-curobo-v2:latest
    container_name: ${INTERNDATA_ISAAC_CONTAINER_NAME:-isaac}
    network_mode: host
    runtime: nvidia
    privileged: false
    user: "${INTERNDATA_CONTAINER_UID:-1234}:${INTERNDATA_CONTAINER_GID:-1234}"
    stdin_open: true
    tty: true
    shm_size: "8gb"
    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      OMNI_KIT_ACCEPT_EULA: "YES"
      NVIDIA_VISIBLE_DEVICES: ${INTERNDATA_ISAAC_GPU_DEVICE_IDS:-0}
      NVIDIA_DRIVER_CAPABILITIES: all
      ISAAC_SIM_PATH: /isaac-sim
      CUROBO_PATH: /workspace/InternDataAssets/curobov2
      CUROBO_PYTHON_PATH: /workspace/InternDataAssets/curobov2
      HOME: /workspace
      XDG_CACHE_HOME: /workspace/.cache
      XDG_CONFIG_HOME: /workspace/.config
      MPLCONFIGDIR: /workspace/.cache/matplotlib
      LIVESTREAM: ${LIVESTREAM:-0}
      INTERNDATA_RUN_IMPORT_CHECKS: ${INTERNDATA_RUN_IMPORT_CHECKS:-0}
      INTERNDATA_AUTOSTART_LAUNCHER: ${INTERNDATA_AUTOSTART_LAUNCHER:-1}
      INTERNDATA_LAUNCHER_CONFIG: ${INTERNDATA_LAUNCHER_CONFIG:?INTERNDATA_LAUNCHER_CONFIG must be set by scripts/docker/up_simbox_isaac.sh}
      INTERNDATA_LAUNCHER_EXTRA_ARGS: ${INTERNDATA_LAUNCHER_EXTRA_ARGS:-}
      INTERNDATA_LAUNCHER_ARGS_JSON: "${INTERNDATA_LAUNCHER_ARGS_JSON:-[]}"
      INTERNDATA_TASK_CONFIG: ${INTERNDATA_TASK_CONFIG:-}
      INTERNDATA_EPISODE_EVENT_PATH: ${INTERNDATA_EPISODE_EVENT_PATH:-}
      INTERNDATA_RANDOM_SEED: ${INTERNDATA_RANDOM_SEED:-}
      INTERNDATA_GPU: ${INTERNDATA_GPU:-}
      INTERNDATA_TASK_PATH: ${INTERNDATA_TASK_PATH:-}
      INTERNDATA_DEBUG_TOPDOWN: ${INTERNDATA_DEBUG_TOPDOWN:-0}
      INTERNDATA_DEBUG_RESET_LIFECYCLE: ${INTERNDATA_DEBUG_RESET_LIFECYCLE:-0}
      CUROBO_DEBUG_WORLD_COLLISION: ${CUROBO_DEBUG_WORLD_COLLISION:-0}
      CUROBO_TORCH_CUDA_GRAPH_RESET: ${CUROBO_TORCH_CUDA_GRAPH_RESET:-1}
      SIMBOX_DEBUG_OUTPUT_DIR: ${SIMBOX_DEBUG_OUTPUT_DIR:-output/simbox_debug}
      SIMBOX_DEBUG_PICK: ${SIMBOX_DEBUG_PICK:-0}
    volumes:
      - ${ISAAC_CACHE_MAIN:-../.docker/isaac-sim/cache/main}:/isaac-sim/.cache:rw
      - ${ISAAC_CACHE_COMPUTE:-../.docker/isaac-sim/cache/computecache}:/isaac-sim/.nv/ComputeCache:rw
      - ${ISAAC_LOGS:-../.docker/isaac-sim/logs}:/isaac-sim/.nvidia-omniverse/logs:rw
      - ${ISAAC_CONFIG:-../.docker/isaac-sim/config}:/isaac-sim/.nvidia-omniverse/config:rw
      - ${ISAAC_DATA:-../.docker/isaac-sim/data}:/isaac-sim/.local/share/ov/data:rw
      - ${ISAAC_PKGS:-../.docker/isaac-sim/pkg}:/isaac-sim/.local/share/ov/pkg:rw
      - /usr/share/nvidia/nvoptix.bin:/usr/share/nvidia/nvoptix.bin:ro
      - ../docker/isaac/entrypoint.sh:/entrypoint.sh:ro
      - ..:/workspace:rw
      - ../InternDataAssets/curobov2:/workspace/InternDataAssets/curobov2:ro
    tmpfs:
      - /isaac-sim/kit/cache:rw,exec
      - /isaac-sim/kit/data:rw,exec
    working_dir: /workspace
    entrypoint: ["/entrypoint.sh"]
