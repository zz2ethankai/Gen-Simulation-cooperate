name: ${INTERNDATA_COMPOSE_PROJECT:-isaac-nav2-stack}

services:
  isaac:
    build:
      context: ..
      dockerfile: docker/isaac/Dockerfile
    image: local/isaac-sim-4.1.0-curobo-app:latest
    container_name: ${INTERNDATA_ISAAC_CONTAINER_NAME:-isaac}
    network_mode: host
    gpus:
      - driver: nvidia
        device_ids: ["${INTERNDATA_ISAAC_GPU_DEVICE_IDS:-0}"]
        capabilities: [gpu]
    privileged: false
    stdin_open: true
    tty: true
    shm_size: "8gb"
    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      OMNI_KIT_ACCEPT_EULA: "YES"
      OMNI_KIT_ALLOW_ROOT: "1"
      ISAAC_SIM_PATH: /isaac-sim
      CUROBO_PATH: /opt/curobo
      ROS_DISTRO: humble
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      LIVESTREAM: ${LIVESTREAM:-0}
      INTERNDATA_AUTOSTART_LAUNCHER: ${INTERNDATA_AUTOSTART_LAUNCHER:-1}
      INTERNDATA_LAUNCHER_CONFIG: ${INTERNDATA_LAUNCHER_CONFIG:?INTERNDATA_LAUNCHER_CONFIG must be set by scripts/docker/up_nav2_stack.sh}
      INTERNDATA_LAUNCHER_EXTRA_ARGS: ${INTERNDATA_LAUNCHER_EXTRA_ARGS:-}
      INTERNDATA_LAUNCHER_ARGS_JSON: "${INTERNDATA_LAUNCHER_ARGS_JSON:-[]}"
      INTERNDATA_TASK_CONFIG: ${INTERNDATA_TASK_CONFIG:-}
      INTERNDATA_EPISODE_EVENT_PATH: ${INTERNDATA_EPISODE_EVENT_PATH:-}
      INTERNDATA_RANDOM_SEED: ${INTERNDATA_RANDOM_SEED:-}
      INTERNDATA_GPU: ${INTERNDATA_GPU:-}
      INTERNDATA_TASK_PATH: ${INTERNDATA_TASK_PATH:-}
      INTERNDATA_DEBUG_TOPDOWN: ${INTERNDATA_DEBUG_TOPDOWN:-0}
      SIMBOX_DEBUG_OUTPUT_DIR: ${SIMBOX_DEBUG_OUTPUT_DIR:-output/simbox_debug}
    volumes:
      - ${ISAAC_CACHE_MAIN:-../.docker/isaac-sim/cache/main}:/root/.cache/ov:rw
      - ${ISAAC_CACHE_COMPUTE:-../.docker/isaac-sim/cache/computecache}:/root/.nv/ComputeCache:rw
      - ${ISAAC_LOGS:-../.docker/isaac-sim/logs}:/root/.nvidia-omniverse/logs:rw
      - ${ISAAC_CONFIG:-../.docker/isaac-sim/config}:/root/.nvidia-omniverse/config:rw
      - ${ISAAC_DATA:-../.docker/isaac-sim/data}:/root/.local/share/ov/data:rw
      - ${ISAAC_PKGS:-../.docker/isaac-sim/pkg}:/root/.local/share/ov/pkg:rw
      - /usr/share/nvidia/nvoptix.bin:/usr/share/nvidia/nvoptix.bin:ro
      - ../docker/isaac/entrypoint.sh:/entrypoint.sh:ro
      - ..:/workspace:rw
    working_dir: /workspace
    entrypoint: ["/entrypoint.sh"]

  nav2:
    build:
      context: ..
      dockerfile: docker/nav2/Dockerfile
    image: local/ros2-humble-nav2:latest
    container_name: ${INTERNDATA_NAV2_CONTAINER_NAME:-nav2}
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      TURTLEBOT3_MODEL: waffle
      INTERNDATA_AUTOSTART_ROS_STACK: "1"
      # Each Nav2 stack should use its own session UUID so bootstrap config,
      # bootstrap map, exported maps, and bridge request/result directories do
      # not collide across concurrently running containers.
      INTERNDATA_NAV2_SESSION_UUID: ${INTERNDATA_NAV2_SESSION_UUID:-nav2_default}
      # Startup selection is injected from compose instead of being hardcoded
      # in docker/nav2/entrypoint.sh.
      INTERNDATA_NAV2_ROBOT_CONFIG: ${INTERNDATA_NAV2_ROBOT_CONFIG:-}
      INTERNDATA_NAV2_ROBOT_NAME: ${INTERNDATA_NAV2_ROBOT_NAME:-}
      INTERNDATA_NAV2_SKILL_OVERRIDES_JSON: ${INTERNDATA_NAV2_SKILL_OVERRIDES_JSON:-}
      INTERNDATA_BASE_CONFIG: ${INTERNDATA_BASE_CONFIG:-}
      # The remaining bootstrap/config paths are derived from the UUID inside
      # the container unless you explicitly override them.
    volumes:
      - ..:/workspace/InterndataEngine:rw
    working_dir: /workspace/InterndataEngine
    entrypoint: ["/workspace/InterndataEngine/docker/nav2/entrypoint.sh"]
