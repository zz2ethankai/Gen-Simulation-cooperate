name: starvla_franka_single_pick_banana
output_dir: outputs/eval
seeds: [0]

run_args:
  record_video: true
  video_robot: franka
  video_cameras:
    - name: head
      path: raw.cameras.franka_head.color_image
    - name: hand
      path: raw.cameras.franka_hand.color_image
  video_fps: 15

task:
  name: franka_single_pick_banana
  env_type: simbox
  task_config: workflows/simbox/core/configs/tasks/pick_and_place/franka/single_pick/omniobject3d-banana.yaml
  workflow_type: SimBoxDualWorkFlow
  task_index: 0
  max_episode_seconds: 10
  simulator:
    physics_dt: "1/30"
    rendering_dt: "1/30"
    stage_units_in_meters: 1.0
    headless: true
    anti_aliasing: 0
    multi_gpu: false
    active_gpu: 0
    physics_gpu: 0
    max_gpu_count: 1
  env_args:
    randomize: true
    render: true
    action:
      mode: franka_eef_delta
      robot_name: franka
      arm: left
      position_frame: base
      rotation_frame: base
      rotation_degrees: false
      gripper_close_threshold: 0.5
      controller_eps: 0.0001
      controller_plan_step: goal
      debug_action_every: 16
      max_position_delta: 0.05
      max_rotation_delta: 0.25
    success_predicate:
      type: object_lifted
      object: pick_object_left
      min_delta_z: 0.02

policy:
  name: starvla_policy_server
  policy_type: starvla_msgpack
  host: 127.0.0.1
  port: 10093
  action_dim: 7
  open_loop_horizon: 16
  policy_args:
    timeout_s: 5
    unnorm_key: franka
    prompt_key: detailed_prompt
    image_keys:
      - raw.cameras.franka_head.color_image
      - raw.cameras.franka_hand.color_image
    state_key: raw.robots.franka.states.gripper.pose
    request_args:
      do_sample: false
      use_ddim: true
      num_ddim_steps: 10
