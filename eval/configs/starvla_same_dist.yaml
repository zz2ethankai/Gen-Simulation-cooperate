name: starvla_same_dist_single_pick
output_dir: outputs/eval
seeds: [0]

run_args:
  record_video: true
  video_robot: split_aloha
  video_cameras:
    - name: head
      path: raw.cameras.split_aloha_head.color_image
    - name: hand_left
      path: raw.cameras.split_aloha_hand_left.color_image
  video_fps: 15

task:
  name: split_aloha_single_pick_banana_left
  env_type: simbox
  task_config: workflows/simbox/core/configs/tasks/pick_and_place/split_aloha/single_pick/left/omniobject3d-banana.yaml
  workflow_type: SimBoxDualWorkFlow
  task_index: 0
  max_episode_seconds: 5
  simulator:
    physics_dt: "1/30"
    rendering_dt: "1/30"
    stage_units_in_meters: 1.0
    headless: true
    anti_aliasing: 0
  env_args:
    randomize: true
    render: true
    action:
      robot_name: split_aloha
      joint_indices: [12, 14, 16, 18, 20, 22, 24]
    success_predicate:
      type: object_lifted
      object: pick_object_left
      min_delta_z: 0.02

policy:
  name: starvla_policy_server
  policy_type: starvla_msgpack
  host: 127.0.0.1
  port: 5694
  action_dim: 7
  open_loop_horizon: 8
  policy_args:
    # Fill this when the checkpoint metadata exposes multiple available_unnorm_keys.
    unnorm_key: franka
    prompt_key: detailed_prompt
    image_keys:
      - raw.cameras.split_aloha_head.color_image
      - raw.cameras.split_aloha_hand_left.color_image
    request_args:
      do_sample: false
      use_ddim: true
      num_ddim_steps: 10
