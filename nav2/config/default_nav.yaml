nav2_runtime_defaults:
  position_tolerance_m: 0.10
  yaw_tolerance_rad: 0.10
  runtime_timeout_sec: 30.0

ros:
  localization:
    map_output_dir: output/nav2_maps
  nav2:
    enabled: true
    runtime_mode: external_compose
    stack_request_root: output/ros_bridge/runtime_requests
    stack_status_root: output/ros_bridge/runtime_status
    goal_request_root: output/ros_bridge/goal_requests
    goal_status_root: output/ros_bridge/goal_status
    goal_result_root: output/ros_bridge/goal_result
    stack_reuse: true
    goal_transport: ros_topic_bridge
    load_map_service: /map_server/load_map
    clear_global_costmap_service: /global_costmap/clear_entirely_global_costmap
    clear_local_costmap_service: /local_costmap/clear_entirely_local_costmap
    bridge_map_update_topic: /simbox/nav_bridge/map_update
    bridge_goal_topic: /simbox/nav_bridge/goal
    bridge_plan_topic: /simbox/nav_bridge/plan
    bridge_cancel_topic: /simbox/nav_bridge/cancel
    bridge_reset_topic: /simbox/nav_bridge/reset
    bridge_status_topic: /simbox/nav_bridge/status
    bridge_result_topic: /simbox/nav_bridge/result
    bridge_plan_result_topic: /simbox/nav_bridge/plan_result
    bridge_alive_timeout_sec: 3.0

# Runtime behavior that is consumed by the SimBox navigation skill rather than
# passed directly to a Nav2 node. Native Nav2 parameters live in nav2_params.yaml.
nav2_skill:
  controller_server:
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.10
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      stateful: true
      trans_stopped_velocity: 0.005
      rot_stopped_velocity: 0.005
  costmap:
    footprint_padding: 0.03
    inflation_layer:
      cost_scaling_factor: 3.0
  behavior_tree:
    path_validity_check_hz: 1.0
    planner_retry_attempt_limit: 1
    follow_path_retry_attempt_limit: 1
    navigation_retry_attempt_limit: 3
    costmap_clear_wait_sec: 1
    remove_passed_goals_radius: 0.7
