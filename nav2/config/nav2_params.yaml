defaults:
  controller_plugin: nav2_rotation_shim_controller::RotationShimController
  planner_plugin: nav2_smac_planner/SmacPlannerLattice

controller_profiles:
  nav2_mppi_controller::MPPIController: &mppi_controller
    plugin: nav2_mppi_controller::MPPIController
    time_steps: 30
    model_dt: 0.06666666666666667
    batch_size: 1200
    iteration_count: 1
    prune_distance: 1.8
    transform_tolerance: 0.3
    temperature: 0.3
    gamma: 0.015
    motion_model: Omni
    open_loop: false
    visualize: false
    # Preserve MPPI's warm-started noise sequence across control iterations.
    regenerate_noises: false
    reset_period: 1.0
    retry_attempt_limit: 1
    # Populated from platform.nav2.controller_hard_limits.
    vx_max: null
    vx_min: null
    vy_max: null
    vy_min: null
    wz_max: null
    ax_max: null
    ax_min: null
    ay_max: null
    ay_min: null
    az_max: null
    vx_std: 0.35
    vy_std: 0.35
    wz_std: 0.35
    TrajectoryVisualizer:
      trajectory_step: 5
      time_step: 3
    TrajectoryValidator:
      plugin: mppi::DefaultOptimalTrajectoryValidator
      collision_lookahead_time: 2.0
      consider_footprint: true
    critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - TwirlingCritic
    ConstraintCritic:
      enabled: true
      cost_power: 1
      cost_weight: 4.0
    CostCritic:
      enabled: true
      cost_power: 1
      cost_weight: 3.8
      critical_cost: 300.0
      consider_footprint: true
      collision_cost: 1000000.0
      near_goal_distance: 0.4
      trajectory_point_step: 2
    GoalCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      threshold_to_consider: 1.4
    GoalAngleCritic:
      enabled: true
      cost_power: 1
      cost_weight: 3.0
      threshold_to_consider: 0.4
    PathAlignCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      threshold_to_consider: 0.8
      offset_from_furthest: 10
      max_path_occupancy_ratio: 0.2
      use_path_orientations: false
    PathFollowCritic:
      enabled: true
      cost_power: 1
      cost_weight: 8.0
      threshold_to_consider: 1.4
      offset_from_furthest: 6
    PathAngleCritic:
      enabled: true
      cost_power: 1
      cost_weight: 0.5
      threshold_to_consider: 0.8
      offset_from_furthest: 10
      max_angle_to_furthest: 0.78539816339
      forward_preference: false
      mode: 2
    TwirlingCritic:
      enabled: true
      cost_power: 1
      cost_weight: 8.0
    closed_loop: true

  nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController:
    plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
    desired_linear_vel: 0.20
    lookahead_dist: 0.35
    min_lookahead_dist: 0.20
    max_lookahead_dist: 0.55
    lookahead_time: 1.5
    rotate_to_heading_angular_vel: 0.35
    transform_tolerance: 0.4
    use_velocity_scaled_lookahead_dist: false
    min_approach_linear_velocity: 0.04
    approach_velocity_scaling_dist: 0.45
    use_collision_detection: true
    max_allowed_time_to_collision_up_to_carrot: 1.0
    use_regulated_linear_velocity_scaling: true
    use_cost_regulated_linear_velocity_scaling: false
    regulated_linear_scaling_min_radius: 0.45
    regulated_linear_scaling_min_speed: 0.04
    use_rotate_to_heading: true
    allow_reversing: false
    rotate_to_heading_min_angle: 0.35
    max_angular_accel: 0.80
    max_robot_pose_search_dist: 2.0
    use_interpolation: true

  dwb_core::DWBLocalPlanner:
    plugin: dwb_core::DWBLocalPlanner
    debug_trajectory_details: false
    short_circuit_trajectory_evaluation: true
    stateful: true
    min_vel_x: -0.35
    max_vel_x: 0.35
    min_vel_y: -0.25
    max_vel_y: 0.25
    max_vel_theta: 0.60
    min_speed_xy: 0.0
    max_speed_xy: 0.40
    min_speed_theta: 0.0
    acc_lim_x: 0.35
    acc_lim_y: 0.35
    acc_lim_theta: 0.70
    decel_lim_x: -0.35
    decel_lim_y: -0.35
    decel_lim_theta: -0.70
    vx_samples: 15
    vy_samples: 15
    vtheta_samples: 20
    sim_time: 1.2
    linear_granularity: 0.05
    angular_granularity: 0.05
    transform_tolerance: 0.4
    critics:
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      - Oscillation
      - RotateToGoal
    BaseObstacle.scale: 0.06
    PathAlign.scale: 20.0
    PathAlign.forward_point_distance: 0.12
    GoalAlign.scale: 16.0
    GoalAlign.forward_point_distance: 0.12
    PathDist.scale: 24.0
    GoalDist.scale: 20.0
    RotateToGoal.scale: 18.0
    RotateToGoal.slowing_factor: 4.0
    RotateToGoal.lookahead_time: -1.0

  nav2_rotation_shim_controller::RotationShimController:
    <<: *mppi_controller
    plugin: nav2_rotation_shim_controller::RotationShimController
    primary_controller: nav2_mppi_controller::MPPIController
    angular_dist_threshold: 0.35
    forward_sampling_distance: 0.5
    # Nominal rotation speed; runtime clamps it to the shared MPPI wz_max cap.
    rotate_to_heading_angular_vel: 0.75
    max_angular_accel: null
    simulate_ahead_time: 1.0
    rotate_to_goal_heading: true

planner_profiles:
  nav2_navfn_planner/NavfnPlanner:
    plugin: nav2_navfn_planner/NavfnPlanner
    tolerance: 0.10
    allow_unknown: false
    use_astar: true

  nav2_smac_planner/SmacPlanner2D:
    plugin: nav2_smac_planner/SmacPlanner2D
    tolerance: 0.10
    allow_unknown: false
    downsample_costmap: false
    downsampling_factor: 1
    max_iterations: 1000000
    max_on_approach_iterations: 1000
    max_planning_time: 2.0
    cost_travel_multiplier: 2.0

  nav2_smac_planner/SmacPlannerLattice:
    plugin: nav2_smac_planner/SmacPlannerLattice
    tolerance: 0.10
    allow_unknown: false
    downsample_costmap: false
    downsampling_factor: 1
    max_iterations: 1000000
    max_on_approach_iterations: 2000
    max_planning_time: 3.0
    smooth_path: true
    # null is populated from platform.nav2.minimum_turning_radius_m.
    minimum_turning_radius: null
    reverse_penalty: 1.0
    change_penalty: 0.0
    non_straight_penalty: 1.05
    cost_penalty: 2.0
    rotation_penalty: 3.0
    retrospective_penalty: 0.015
    analytic_expansion_ratio: 3.5
    analytic_expansion_max_length: 2.5
    analytic_expansion_max_cost: 200.0
    analytic_expansion_max_cost_override: false
    cache_obstacle_heuristic: true
    allow_reverse_expansion: true
    lattice_filepath: /opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/omni/output.json
    smoother:
      tolerance: 1.0e-10
      max_iterations: 1000
      w_data: 0.2
      w_smooth: 0.3
      do_refinement: true

params:
  bt_navigator:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      odom_topic: /odom
      bt_loop_duration: 10
      default_server_timeout: 20
      wait_for_service_timeout: 1000
      default_bt_xml_filename: ""
      default_nav_to_pose_bt_xml: ""
      default_nav_through_poses_bt_xml: ""
      plugin_lib_names:
        - nav2_compute_path_to_pose_action_bt_node
        - nav2_compute_path_through_poses_action_bt_node
        - nav2_smooth_path_action_bt_node
        - nav2_follow_path_action_bt_node
        - nav2_clear_costmap_service_bt_node
        - nav2_goal_updated_condition_bt_node
        - nav2_globally_updated_goal_condition_bt_node
        - nav2_is_path_valid_condition_bt_node
        - nav2_wait_action_bt_node
        - nav2_rate_controller_bt_node
        - nav2_pipeline_sequence_bt_node
        - nav2_recovery_node_bt_node
        - nav2_navigate_through_poses_action_bt_node
        - nav2_navigate_to_pose_action_bt_node
        - nav2_remove_passed_goals_action_bt_node
  bt_navigator_navigate_to_pose_rclcpp_node:
    ros__parameters:
      use_sim_time: true
  controller_server:
    ros__parameters:
      use_sim_time: true
      controller_frequency: 15.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.8
      progress_checker_plugin: progress_checker
      goal_checker_plugins: [general_goal_checker]
      controller_plugins: [FollowPath]
      progress_checker:
        plugin: nav2_controller::PoseProgressChecker
        required_movement_radius: 0.05
        required_movement_angle: 0.10
        movement_time_allowance: 30.0
      general_goal_checker:
        stateful: true
        plugin: nav2_controller::StoppedGoalChecker
        xy_goal_tolerance: 0.10
        yaw_goal_tolerance: 0.10
        trans_stopped_velocity: 0.005
        rot_stopped_velocity: 0.005
      FollowPath: {}
  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: true
        update_frequency: 10.0
        publish_frequency: 4.0
        global_frame: odom
        robot_base_frame: base_link
        rolling_window: true
        width: 6
        height: 6
        resolution: 0.02
        footprint: ""
        footprint_padding: 0.03
        plugins: [static_layer, inflation_layer]
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 3.0
          inflation_radius: null
        always_send_full_costmap: true
  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: true
        update_frequency: 4.0
        publish_frequency: 2.0
        global_frame: map
        robot_base_frame: base_link
        rolling_window: false
        resolution: 0.02
        track_unknown_space: false
        footprint: ""
        footprint_padding: 0.03
        plugins: [static_layer, inflation_layer]
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 3.0
          inflation_radius: null
        always_send_full_costmap: true
  planner_server:
    ros__parameters:
      use_sim_time: true
      expected_planner_frequency: 10.0
      planner_plugins: [GridBased]
      GridBased: {}
  smoother_server:
    ros__parameters:
      use_sim_time: true
      smoother_plugins: [simple_smoother]
      simple_smoother:
        plugin: nav2_smoother::SimpleSmoother
        tolerance: 1.0e-10
        max_its: 1000
        do_refinement: true
  behavior_server:
    ros__parameters:
      use_sim_time: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: [wait]
      spin:
        plugin: nav2_behaviors/Spin
      backup:
        plugin: nav2_behaviors/BackUp
      drive_on_heading:
        plugin: nav2_behaviors/DriveOnHeading
      wait:
        plugin: nav2_behaviors/Wait
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.2
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.1
      rotational_acc_lim: 3.0
  waypoint_follower:
    ros__parameters:
      use_sim_time: true
      loop_rate: 20
      stop_on_failure: false
      waypoint_task_executor_plugin: wait_at_waypoint
      wait_at_waypoint:
        plugin: nav2_waypoint_follower::WaitAtWaypoint
        enabled: true
        waypoint_pause_duration: 0
  velocity_smoother:
    ros__parameters:
      use_sim_time: true
      smoothing_frequency: 15.0
      scale_velocities: false
      feedback: CLOSED_LOOP
      max_velocity: []
      min_velocity: []
      max_accel: []
      max_decel: []
      odom_topic: /odom
      odom_duration: 0.1
      deadband_velocity: [0.0, 0.0, 0.0]
      velocity_timeout: 1.0
  map_server:
    ros__parameters:
      use_sim_time: true
      yaml_filename: ""
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  local_costmap_client:
    ros__parameters:
      use_sim_time: true
  planner_server_rclcpp_node:
    ros__parameters:
      use_sim_time: true
  controller_server_rclcpp_node:
    ros__parameters:
      use_sim_time: true
  behavior_server_rclcpp_node:
    ros__parameters:
      use_sim_time: true
  waypoint_follower_rclcpp_node:
    ros__parameters:
      use_sim_time: true
  amcl:
    ros__parameters:
      enabled: false
  amcl_rclcpp_node:
    ros__parameters:
      use_sim_time: true
