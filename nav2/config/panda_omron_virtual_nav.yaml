nav2_skill:
  controller_server:
    # Keep checking XY after heading alignment. With stateful=true Nav2 can
    # latch a transient XY hit, then report success after drifting outside the
    # skill's strict final tolerance during the terminal rotation.
    goal_checker:
      stateful: false
      xy_goal_tolerance: 0.10
    follow_path:
      # RotationShim owns a second PositionGoalChecker for terminal heading
      # alignment. It must not latch an old XY hit, otherwise it keeps turning
      # after the physical base has drifted outside the Nav2 goal tolerance.
      position_checker:
        stateful: false
      # This holonomic base must start facing the manipulation goal while it
      # still has clearance. Otherwise MPPI reaches the tight endpoint with a
      # large yaw error and RotationShim has to attempt an in-place turn there.
      GoalAngleCritic:
        threshold_to_consider: 1.4
        cost_weight: 7.5
      # The footprint is asymmetric. Following the planned yaw keeps MPPI from
      # reaching a tight approach pose with an orientation that is not safe for
      # an in-place RotationShim correction.
      PathAlignCritic:
        use_path_orientations: true
      TwirlingCritic:
        cost_weight: 0.5
  costmap:
    footprint_padding: 0.04
  local_costmap:
    footprint_padding: 0.0
  planner_server:
    minimum_turning_radius: 0.0
  velocity_smoother:
    feedback: CLOSED_LOOP
