wheel_base: 0.64
track_width: 0.56
wheel_radius: 1.0
ackermann_split_steering: false
ackermann_split_wheel_speeds: false
steering_limit: 0.0
steering_rate_limit: 0.0
wheel_velocity_limit: 1.5
command_timeout: 0.25
steering_command_sign: 1.0
virtual_drive_stiffness: 0.0
virtual_linear_drive_damping: 25000.0
virtual_linear_drive_max_force: 60000.0
# Sized to realize the local controller's yaw acceleration limit under the
# virtual base's measured inertia, including terminal deceleration.
virtual_yaw_drive_damping: 25000.0
virtual_yaw_drive_max_force: 60000.0
body_twist_deadband: 0.0001
debug_history_size: 4096
platform:
  profile: virtual_base
  local_navigation:
    settle:
      linear_speed_tolerance: 0.005
      angular_speed_tolerance: 0.005
      consecutive_steps: 8
    footprint_points:
      - [0.18, 0.32]
      - [-0.58, 0.32]
      - [-0.58, -0.32]
      - [0.18, -0.32]
    inflation_radius_m: 0.34
    minimum_turning_radius_m: 0.0
    max_steer_angle_ackermann: 0.0
    controller_hard_limits:
      max_velocity: [1.00, 1.00, 0.5]
      min_velocity: [-1.00, -1.00, -0.5]
      max_accel: [0.80, 0.80, 1.00]
      max_decel: [-1.20, -1.20, -1.50]
