wheel_base: 0.64
track_width: 0.56
wheel_radius: 1.0
ackermann_split_steering: false
ackermann_split_wheel_speeds: false
steering_limit: 0.0
steering_rate_limit: 0.0
wheel_velocity_limit: 1.5
command_timeout: 0.25
restore_done_tolerance: 0.005
restore_done_velocity_tolerance: 0.02
steering_command_sign: 1.0
virtual_drive_stiffness: 0.0
virtual_linear_drive_damping: 1000.0
virtual_linear_drive_max_force: 600.0
virtual_yaw_drive_damping: 1500.0
virtual_yaw_drive_max_force: 600.0
body_twist_deadband: 0.0001
debug_history_size: 4096
platform:
  profile: virtual_base
  nav2:
    footprint_points:
      - [0.18, 0.32]
      - [-0.58, 0.32]
      - [-0.58, -0.32]
      - [0.18, -0.32]
    inflation_radius_m: 0.34
    minimum_turning_radius_m: 0.0
    max_steer_angle_ackermann: 0.0
    controller_hard_limits:
      max_velocity: [1.50, 1.50, 1.50]
      min_velocity: [-1.50, -1.50, -1.50]
      max_accel: [3.00, 3.00, 3.14]
      max_decel: [-3.00, -3.00, -3.14]
ros:
  cmd_vel_topic: /cmd_vel
  joint_state_topic: /joint_states
  odom_topic: /odom
  tf_enabled: true
  base_frame: mobilebase0_base
  odom_frame: odom
  localization:
    map_z_min: 0.0
    map_z_max: 1.25
  virtual_odom:
    enabled: false
    publish_twist: true
    use_world_z: true
    default_z: 0.0
