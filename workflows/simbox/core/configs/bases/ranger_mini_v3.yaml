wheel_base: 0.494
track_width: 0.364
wheel_radius: 0.09
ackermann_split_steering: true
ackermann_split_wheel_speeds: true
steering_limit: 2.1
steering_rate_limit: 2.4
wheel_velocity_limit: 20.0
command_timeout: 0.25
restore_done_tolerance: 0.005
restore_done_velocity_tolerance: 0.5
wheel_static_friction: 0.95
wheel_dynamic_friction: 0.75
wheel_drive_stiffness: 0.0
wheel_drive_damping: 140.0
wheel_drive_max_force: 220.0
steering_drive_stiffness: 300000.0
steering_drive_damping: 25000.0
steering_drive_max_force: 25000.0
steering_command_sign: -1.0
body_twist_deadband: 0.0001
module_speed_deadband: 0.00001
debug_history_size: 4096
platform:
  profile: ranger_mini_v3
  nav2:
    footprint_points:
      - [-0.395, 0.250]
      - [0.055, 0.250]
      - [0.055, 0.400]
      - [0.600, 0.400]
      - [0.600, 0.220]
      - [0.423, 0.220]
      - [0.423, -0.220]
      - [0.600, -0.220]
      - [0.600, -0.400]
      - [0.055, -0.400]
      - [0.055, -0.250]
      - [-0.395, -0.250]
    # Inflation radius was raised from 0.34 to improve footprint checking, but
    # 0.75 m blocked narrow passages and made goals unreachable. Use 0.55 m as a
    # compromise: it is below the circumscribed radius so Nav2 logs a warning and
    # disables the possibly-inscribed shortcut, but the full footprint check still
    # runs. This avoids both the old "plan through obstacles" bug and the new
    # "no valid path" failure.
    inflation_radius_m: 0.34
    minimum_turning_radius_m: 0.47644
    max_steer_angle_ackermann: 0.6981
    controller_hard_limits:
      max_velocity: [0.45, 0.32, 0.75]
      min_velocity: [-0.45, -0.32, -0.75]
      max_accel: [0.45, 0.45, 0.90]
      max_decel: [-0.45, -0.45, -0.90]
ros:
  ranger_model: ranger_mini_v3
  cmd_vel_topic: /cmd_vel
  joint_state_topic: /joint_states
  odom_topic: /odom
  tf_enabled: true
  base_frame: base_link
  odom_frame: odom
  virtual_odom:
    enabled: false
    publish_twist: true
    use_world_z: true
    default_z: 0.0
