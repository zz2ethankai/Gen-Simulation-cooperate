      - [-0.395, 0.250]
      - [0.055, 0.250]
      - [0.055, 0.400]
      - [0.600, 0.400]
      - [0.600, 0.220]
      - [0.423, 0.220]
      - [0.423, -0.220]
      - [0.600, -0.220]
      - [0.600, -0.400]
      - [0.055, -0.400]
      - [0.055, -0.250]
      - [-0.395, -0.250]
    inflation_radius_m: 0.34
    minimum_turning_radius_m: 0.0
    max_steer_angle_ackermann: 0.0
    controller_hard_limits:
      max_velocity: [0.45, 0.32, 0.75]
      min_velocity: [-0.45, -0.32, -0.75]
      max_accel: [0.45, 0.45, 0.90]
      max_decel: [-0.45, -0.45, -0.90]
