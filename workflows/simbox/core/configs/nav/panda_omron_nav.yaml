nav2_skill:
  planner_server:
    plugin: nav2_navfn_planner/NavfnPlanner
    tolerance: 0.10
    allow_unknown: false
    use_astar: true
  controller_server:
    min_y_velocity_threshold: 0.0
    follow_path:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.20
      lookahead_dist: 0.35
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.55
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.35
      transform_tolerance: 0.4
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.45
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.45
      regulated_linear_scaling_min_speed: 0.04
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 0.80
      max_robot_pose_search_dist: 2.0
      use_interpolation: true
  local_costmap:
    footprint_padding: 0.02
    cost_scaling_factor: 2.0
  global_costmap:
    footprint_padding: 0.00
    cost_scaling_factor: 2.0
  velocity_smoother:
    feedback: OPEN_LOOP
    deadband_velocity: [0.0, 0.0, 0.0]
