target_class: UnitreeG1
path: InternDataAssets/assets/unitree_g1_sonic/g1/g1_29dof_with_dex3_rev_1_0.usd
solver_position_iteration_count: 8
solver_velocity_iteration_count: 4
stabilization_threshold: 0.005
body_joint_names:
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_hip_yaw_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_pitch_joint
  - right_hip_roll_joint
  - right_hip_yaw_joint
  - right_knee_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint
  - waist_yaw_joint
  - waist_roll_joint
  - waist_pitch_joint
  - left_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - left_shoulder_yaw_joint
  - left_elbow_joint
  - left_wrist_roll_joint
  - left_wrist_pitch_joint
  - left_wrist_yaw_joint
  - right_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_shoulder_yaw_joint
  - right_elbow_joint
  - right_wrist_roll_joint
  - right_wrist_pitch_joint
  - right_wrist_yaw_joint
base:
  base_config_file: workflows/simbox/core/configs/bases/unitree_g1_sonic.yaml
  local_navigation_config_file: workflows/simbox/core/configs/navigation/default_local_navigation.yaml
  local_navigation:
    planner:
      # Approach the final pose along its requested yaw so the forward-only G1
      # does not need a large corrective turn while already at the goal.
      terminal_approach_distance_m: 0.6
      terminal_approach_step_m: 0.1
    controller:
      controller_type: phased_waypoint
      terminal_max_linear_velocity: 0.15
      max_lateral_velocity: 0.20
      lateral_gain: 2.0
      lateral_alignment_enter_m: 0.08
      lateral_alignment_exit_m: 0.04
      max_angular_velocity: 0.5
      # The G1 controller emits only one primitive per control step: turn to the
      # path segment, move laterally onto it, or walk straight along it.
      rotate_first_error_rad: 3.141592653589793
