  source_tasks:
  - id: kitchen_task_01
    target: Apple to Tray
    core_objects:
    - apple
    - metal_tray
    steps:
    - navigate to prep zone
    - grasp apple
    - navigate to tray
    - place apple in tray center
    - arm home
    success: apple rests inside tray without rolling out
    available_core_objects:
    - apple
    - metal_tray
    missing_core_objects: []
  - id: kitchen_task_02
    target: Cup Transfer
    core_objects:
    - white_mug_a
    steps:
    - navigate to sink counter
    - grasp mug by handle
    - move to prep counter
    - place mug upright
    - vertical retreat
    success: mug is upright and more than 5cm from counter edge
    available_core_objects:
    - white_mug_a
    missing_core_objects: []
  - id: kitchen_task_03
    target: Salt Bottle Placement
    core_objects:
    - salt_bottle
    - cutting_board
    steps:
    - navigate to storage zone
    - grasp salt bottle
    - move to prep zone
    - place upright 10cm left of cutting board
    - release
    success: salt bottle is upright about 10cm from cutting board
    available_core_objects:
    - salt_bottle
    - cutting_board
    missing_core_objects: []
  - id: kitchen_task_04
    target: Prep Assembly
    core_objects:
    - fruit_knife
    - banana
    - cutting_board
    steps:
    - grasp knife by handle
    - place flat on cutting board right side blade inward
    - align to banana
    - grasp banana middle
    - move to board front
    - place banana left of board
    - release
    - home
    success: knife is flat, banana is nearby, no collision
    available_core_objects:
    - fruit_knife
    - banana
    - cutting_board
    missing_core_objects: []
  - id: kitchen_task_05
    target: Breakfast Setup
    core_objects:
    - bread_slice_a
    - orange
    - metal_tray
    steps:
    - grasp bread slice from fridge-side counter
    - place on tray left
    - return to prep zone
    - grasp orange
    - place orange right of bread on tray
    - release
    success: bread and orange are both stable inside tray
    available_core_objects:
    - bread_slice_a
    - orange
    - metal_tray
    missing_core_objects: []
