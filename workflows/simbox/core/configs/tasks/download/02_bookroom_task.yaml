  source_tasks:
  - id: study_task_01
    target: Book Retrieval
    core_objects:
    - hardcover_book_a
    steps:
    - navigate to bookcase
    - grasp book spine
    - move to desk
    - place book flat on desk center
    - arm home
    success: book lies flat on desk with cover up
    available_core_objects:
    - hardcover_book_a
    missing_core_objects: []
  - id: study_task_02
    target: Pen to Holder
    core_objects:
    - black_pen_a
    - pen_holder
    steps:
    - navigate desk
    - grasp center pen
    - move above pen holder
    - drop pen into holder
    - retreat
    success: pen is inside holder below rim
    available_core_objects:
    - black_pen_a
    - pen_holder
    missing_core_objects: []
  - id: study_task_03
    target: Cup Relocation
    core_objects:
    - coffee_mug
    steps:
    - navigate desk left
    - grasp mug side
    - move to desk left upper target
    - place upright
    success: mug is upright and more than 5cm from desk edge
    available_core_objects:
    - coffee_mug
    missing_core_objects: []
