  source_tasks:
  - id: living_task_01
    target: Remote to Basket
    core_objects:
    - remote_control
    - storage_basket
    steps:
    - navigate coffee table
    - grasp remote
    - navigate shelf
    - place remote inside basket
    - home
    success: remote is fully inside basket
    available_core_objects:
    - remote_control
    - storage_basket
    missing_core_objects: []
  - id: living_task_02
    target: Mug to Coaster
    core_objects:
    - livingroom_mug
    - round_coaster_a
    steps:
    - navigate coffee table
    - grasp mug upright
    - place on coaster center
    - vertical retreat
    success: mug bottom center lies on coaster and remains upright
    available_core_objects:
    - livingroom_mug
    - round_coaster_a
    missing_core_objects: []
  - id: living_task_03
    target: Phone to Side Cabinet
    core_objects:
    - phone
    steps:
    - grasp phone long sides from coffee table
    - navigate side cabinet
    - place screen up
    - release
    success: phone is flat screen up and does not slide
    available_core_objects:
    - phone
    missing_core_objects: []
  - id: living_task_04
    target: Coffee Table Cleanup
    core_objects:
    - remote_control
    - storage_basket
    - magazine_a
    steps:
    - put remote in basket on shelf
    - return coffee table
    - grasp magazine
    - place magazine on TV cabinet left
    success: remote is in basket on shelf, magazine flat on TV cabinet
    available_core_objects:
    - remote_control
    - storage_basket
    - magazine_a
    missing_core_objects: []
  - id: living_task_05
    target: Toy Blocks Cleanup
    core_objects:
    - toy_block
    - storage_basket
    steps:
    - navigate rug edge
    - pick block one from rug
    - drop in basket
    - repeat for block two
    - repeat for block three
    success: all three toy blocks are inside basket
    available_core_objects:
    - toy_block
    - storage_basket
    missing_core_objects: []
