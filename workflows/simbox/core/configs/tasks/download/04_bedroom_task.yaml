  source_tasks:
  - id: bedroom_task_01
    target: Phone Placement
    core_objects:
    - bedroom_phone
    steps:
    - navigate right nightstand
    - grasp phone long sides
    - place phone in safe center
    - release
    success: phone is flat screen up and more than 5cm from nightstand edge
    available_core_objects:
    - bedroom_phone
    missing_core_objects: []
  - id: bedroom_task_02
    target: T-shirt to Storage Box
    core_objects:
    - folded_tshirt
    - clothing_storage_box
    steps:
    - navigate bed bench
    - grasp folded T-shirt
    - move to wardrobe zone
    - place flat inside clothing storage box
    - release
    success: T-shirt is fully inside box and remains folded
    available_core_objects:
    - folded_tshirt
    - clothing_storage_box
    missing_core_objects: []
  - id: bedroom_task_03
    target: Hand Cream to Organizer
    core_objects:
    - hand_cream
    - small_organizer
    steps:
    - navigate vanity desk
    - grasp hand cream tube
    - lower above organizer on lower shelf
    - place tube inside organizer
    - release
    success: hand cream tube is inside organizer
    available_core_objects:
    - hand_cream
    - small_organizer
    missing_core_objects: []
  - id: bedroom_task_04
    target: Bedside Floor Cleanup
    core_objects:
    - sock_roll
    - clothing_storage_box
    steps:
    - navigate bedside rug edge
    - pick sock roll from floor
    - move to wardrobe zone
    - place in clothing storage box
    - release
    success: sock roll is inside clothing storage box
    available_core_objects:
    - sock_roll
    - clothing_storage_box
    missing_core_objects: []
  - id: bedroom_task_05
    target: Bedtime Item Arrangement
    core_objects:
    - bedside_book
    - water_glass
    - alarm_clock
    steps:
    - place bedside book on left nightstand center front
    - grasp water glass from right nightstand
    - keep upright
    - check alarm clock is stable on left nightstand back
    success: book is flat on left nightstand, water glass upright on right, alarm
      clock stable on left back
    available_core_objects:
    - bedside_book
    - water_glass
    - alarm_clock
    missing_core_objects: []
